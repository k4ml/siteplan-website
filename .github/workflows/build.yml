name: Build site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build the site
        run: uv run ssg.py . _site

      - name: Validate the output
        run: python3 scripts/check_site.py _site

      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 14
          if-no-files-found: error
