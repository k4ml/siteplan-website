name: Build site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    outputs:
      deployable: ${{ steps.creds.outputs.present }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build the site
        run: uv run ssg.py . _site

      - name: Validate the output
        run: python3 scripts/check_site.py _site

      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 14
          if-no-files-found: error

      # A job-level `if` cannot read `secrets`, so resolve it in a step and
      # publish the answer as a job output. The value never leaves this step.
      - name: Check for Cloudflare credentials
        id: creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN is not set; skipping the deploy." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Deploy to Cloudflare
    needs: build
    if: needs.build.outputs.deployable == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://siteplan.koditi.my
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download the built site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: .
